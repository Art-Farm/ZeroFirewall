# ==================================================================
# Zero Firewall v1.0-RELEAZE (NFTables)
# От Art_Farm ( https://discord.com/art_farm )
# [!] Не рекомендуется редактировать, если вы сами не знаете, что делаете!
# ==================================================================

flush ruleset

table inet filter {

    # Разрешённые TCP порты для IPv4
    set allowed_tcp4 {
        type inet_service
        flags interval
        elements = { 80, 443, 3306, 25565, 22 }
    }
    
    # Разрешённые UDP порты для IPv4
    set allowed_udp4 {
        type inet_service
        flags interval
    }
    
    # Разрешённые TCP порты для IPv6
    set allowed_tcp6 {
        type inet_service
        flags interval
    }
    
    # Разрешённые UDP порты для IPv6
    set allowed_udp6 {
        type inet_service
        flags interval
    }
    
    # Белый список IPv4. IP указанные здесь имеют полный обход всех правил, будьте аккуратны!
    # По умолчанию указаны IP CloudFlare.
    set whitelist4 {
        type ipv4_addr
        flags interval
        elements = { 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 104.16.0.0/13, 104.24.0.0/14, 108.162.192.0/18, 131.0.72.0/22, 141.101.64.0/18, 162.158.0.0/15, 172.64.0.0/13, 173.245.48.0/20, 188.114.96.0/20, 190.93.240.0/20, 197.234.240.0/22, 198.41.128.0/17 }
    }
    
    # Белый список IPv6. IP указанные здесь имеют полный обход всех правил, будьте аккуратны!
    # По умолчанию указаны IP CloudFlare.
    set whitelist6 {
        type ipv6_addr
        flags interval
        elements = { 2400:cb00::/32, 2606:4700::/32, 2803:f800::/32, 2405:b500::/32, 2405:8100::/32, 2a06:98c0::/29, 2c0f:f248::/32 }
    }
    
    # Порты, доступные только для определённых IPv4, « порт . IP » ( к примеру elements = { 3306 . 203.0.113.55 } )
    set port_acl4 {
        type inet_service . ipv4_addr
    }
    
    # Порты, доступные только для определённых IPv6 (по аналогии с port_acl4)
    set port_acl6 {
        type inet_service . ipv6_addr
    }
    
    # Заблокированные IPv4 за DDoS.
    set ddos4 {
        type ipv4_addr
        flags dynamic,timeout
       # Время блокировки IPv4 после срабатывания anti-DDoS
        timeout 1h
        size 16384
    }
    
    # Заблокированные IPv6 за DDoS.
    set ddos6 {
        type ipv6_addr
        flags dynamic,timeout
       # Время блокировки IPv6 после срабатывания anti-DDoS
        timeout 1h
        size 16384
    }
 
    # Заблокированные IPv4 за сканирование портов.
    set portscanners4 {
        type ipv4_addr
        flags dynamic,timeout
       # Время блокировки IPv4 после срабатывания anti-PortScanner
        timeout 15m
        size 65536
    }
    
    # Заблокированные IPv6 за сканирование портов.
    set portscanners6 {
        type ipv6_addr
        flags dynamic,timeout
       # Время блокировки IPv6 после срабатывания anti-PortScanner
        timeout 15m
        size 65536
    }
    
    # IPv4 bogon
    set bogon4 {
        type ipv4_addr
        flags interval
        elements = { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4 }
    }
    
    # IPv6 bogon
    set bogon6 {
        type ipv6_addr
        flags interval
        elements = { ::/128, ::1/128, ::ffff:0:0/96, 100::/64, 2001:10::/28, 2001:db8::/32, 3fff::/20, fc00::/7, fec0::/10, ff00::/8 }
    }
    
    chain preraw {
        type filter hook prerouting priority -300; policy accept;
        
        iifname "lo" accept
        iifname "docker0" accept
        
        ip saddr @whitelist4 accept
        ip6 saddr @whitelist6 accept
        
        ip saddr @ddos4 counter drop
        ip6 saddr @ddos6 counter drop
        
        ip saddr @portscanners4 counter drop
        ip6 saddr @portscanners6 counter drop
        
        ip6 saddr :: icmpv6 type { nd-router-solicit, nd-neighbor-solicit } ip6 hoplimit 255 accept

        ip saddr @bogon4 iifname != "wg0" drop
        ip6 saddr @bogon6 iifname != "wg0" drop
        
        meta l4proto tcp tcp flags & (fin|syn|rst|psh|ack|urg) == 0 drop
        meta l4proto tcp tcp flags & (fin|psh|urg) == (fin|psh|urg) drop
        meta l4proto tcp tcp flags & (syn|fin) == (syn|fin) drop
        meta l4proto tcp tcp flags & (syn|rst) == (syn|rst) drop
        meta l4proto tcp tcp flags & (fin|rst) == (fin|rst) drop
        
        # TCP SYN anti-DDoS
        meta nfproto ipv4 meta l4proto tcp tcp flags & (syn|ack) == syn tcp dport @allowed_tcp4 meter syn4_hard { ip saddr timeout 1m limit rate over 500/second burst 1500 packets } update @ddos4 { ip saddr } drop
        meta nfproto ipv4 meta l4proto tcp tcp flags & (syn|ack) == syn tcp dport @allowed_tcp4 meter syn4_soft { ip saddr timeout 1m limit rate over 100/second burst 700 packets } drop

        # TCP SYN anti-DDoS
        meta nfproto ipv6 meta l4proto tcp tcp flags & (syn|ack) == syn tcp dport @allowed_tcp6 meter syn6_hard { ip6 saddr timeout 1m limit rate over 500/second burst 1500 packets } update @ddos6 { ip6 saddr } drop
        meta nfproto ipv6 meta l4proto tcp tcp flags & (syn|ack) == syn tcp dport @allowed_tcp6 meter syn6_soft { ip6 saddr timeout 1m limit rate over 100/second burst 700 packets } drop
        
        meta nfproto ipv4 meta l4proto tcp tcp flags & (syn|ack) == syn tcp dport != @allowed_tcp4 meter scan_tcp4 { ip saddr timeout 20m limit rate over 20/minute burst 20 packets } update @portscanners4 { ip saddr } drop
        meta nfproto ipv6 meta l4proto tcp tcp flags & (syn|ack) == syn tcp dport != @allowed_tcp6 meter scan_tcp6 { ip6 saddr timeout 20m limit rate over 20/minute burst 20 packets } update @portscanners6 { ip6 saddr } drop
        
        meta nfproto ipv4 meta l4proto tcp tcp flags & (syn|ack) == syn tcp dport != @allowed_tcp4 drop
        meta nfproto ipv6 meta l4proto tcp tcp flags & (syn|ack) == syn tcp dport != @allowed_tcp6 drop
    }
    
    chain input {
        type filter hook input priority 0; policy drop;
        
        iifname "lo" accept
        iifname "docker0" accept
        
        ip saddr @whitelist4 accept
        ip6 saddr @whitelist6 accept
        
        # TCP RST anti-DDoS
        meta nfproto ipv4 meta l4proto tcp tcp flags & rst != 0 meter rst4_hard { ip saddr timeout 10s limit rate over 1500/second burst 1000 packets } update @ddos4 { ip saddr } drop
        meta nfproto ipv4 meta l4proto tcp tcp flags & rst != 0 meter rst4_soft { ip saddr timeout 10s limit rate over 500/second burst 500 packets } drop

        # TCP RST anti-DDoS
        meta nfproto ipv6 meta l4proto tcp tcp flags & rst != 0 meter rst6_hard { ip6 saddr timeout 10s limit rate over 1500/second burst 1000 packets } update @ddos6 { ip6 saddr } drop
        meta nfproto ipv6 meta l4proto tcp tcp flags & rst != 0 meter rst6_soft { ip6 saddr timeout 10s limit rate over 500/second burst 500 packets } drop

        ct state established,related accept
        ct state invalid drop
        
        ip frag-off & 0x1fff != 0 ct state established,related accept
        ip frag-off & 0x1fff != 0 drop
        meta nfproto ipv6 exthdr frag exists ct state new drop
        
        meta l4proto tcp ct state new tcp flags & (fin|syn|rst|ack) != syn drop
        meta l4proto tcp ct state new tcp flags syn tcp option maxseg size 1-535 drop
        
        meta nfproto ipv4 meta l4proto tcp tcp flags & (syn|ack) == syn ct state new meter sessioncap4 { ip saddr ct count over 64 } reject with tcp reset
        meta nfproto ipv6 meta l4proto tcp tcp flags & (syn|ack) == syn ct state new meter sessioncap6 { ip6 saddr ct count over 64 } reject with tcp reset
        
        meta nfproto ipv4 meta l4proto tcp tcp dport . ip saddr @port_acl4 ct state new accept
        meta nfproto ipv6 meta l4proto tcp tcp dport . ip6 saddr @port_acl6 ct state new accept
        
        meta nfproto ipv4 meta l4proto tcp tcp dport @allowed_tcp4 ct state new counter accept
        meta nfproto ipv6 meta l4proto tcp tcp dport @allowed_tcp6 ct state new counter accept
        
        meta nfproto ipv4 meta l4proto udp udp dport @allowed_udp4 meter udp4_hard { ip saddr timeout 10s limit rate over 1000/second burst 2000 packets } update @ddos4 { ip saddr } drop
        meta nfproto ipv6 meta l4proto udp udp dport @allowed_udp6 meter udp6_hard { ip6 saddr timeout 10s limit rate over 1000/second burst 2000 packets } update @ddos6 { ip6 saddr } drop
        
        meta nfproto ipv4 meta l4proto udp udp dport @allowed_udp4 meter udp4_src_dport { ip saddr . udp dport timeout 10s limit rate over 500/second burst 1000 packets } drop
        meta nfproto ipv6 meta l4proto udp udp dport @allowed_udp6 meter udp6_src_dport { ip6 saddr . udp dport timeout 10s limit rate over 500/second burst 1000 packets } drop
        
        meta nfproto ipv4 meta l4proto udp udp dport @allowed_udp4 counter accept
        meta nfproto ipv6 meta l4proto udp udp dport @allowed_udp6 counter accept
        
        meta nfproto ipv4 meta l4proto udp meter scan_udp4 { ip saddr timeout 20m limit rate over 20/minute burst 20 packets } update @portscanners4 { ip saddr } drop
        meta nfproto ipv6 meta l4proto udp meter scan_udp6 { ip6 saddr timeout 20m limit rate over 20/minute burst 20 packets } update @portscanners6 { ip6 saddr } drop
        
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        ip protocol icmp icmp type echo-request limit rate 20/second burst 40 packets accept
        
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
        icmpv6 type { nd-router-solicit, nd-neighbor-solicit } ip6 saddr :: ip6 hoplimit 255 accept
        icmpv6 type { nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } ip6 saddr fe80::/10 ip6 hoplimit 255 accept

        icmpv6 type echo-request limit rate 20/second burst 40 packets accept
        icmpv6 type mld-listener-query limit rate 10/second burst 20 packets accept
        icmpv6 type mld-listener-report limit rate 10/second burst 20 packets accept
    }
    
    chain forward {
        type filter hook forward priority 0; policy drop;
        
        ip saddr @whitelist4 accept
        ip daddr @whitelist4 accept
        ip6 saddr @whitelist6 accept
        ip6 daddr @whitelist6 accept
        
        ct state invalid drop

        ct state established,related accept
        
        iifname "docker0" accept
    }
    
    chain output {
        type filter hook output priority 0; policy accept;
    }
}
